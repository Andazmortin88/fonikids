<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#2689ef" />
    <meta
      name="description"
      content="FONIKids: latihan membaca Bahasa Indonesia bersama pendamping, enam level, dan progres lokal."
    />
    <title>FONIKids • Petualangan Membaca</title>
    <style>
      :root {
        --navy: #153b78;
        --blue: #1689f5;
        --cyan: #dff5ff;
        --green: #36bf79;
        --yellow: #ffcb49;
        --pink: #ff85a5;
        --violet: #8d73f4;
        --paper: #fffdf7;
        --muted: #657e9b;
        --shadow: 0 14px 38px rgba(41, 93, 152, 0.12);
        font-family: ui-rounded, 'Trebuchet MS', Arial, sans-serif;
        color: var(--navy);
        background: #e8f8ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background:
          radial-gradient(circle at 5% 0%, #fff8d8, transparent 35%),
          radial-gradient(circle at 95% 10%, #d8f2ff, transparent 42%), #e9f8ff;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 4px solid #eea82c;
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .app-shell {
        max-width: 1180px;
        margin: auto;
        min-height: 100dvh;
        padding: 22px 26px 102px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 22px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 1000;
        font-size: clamp(26px, 4vw, 38px);
        letter-spacing: -1.6px;
        white-space: nowrap;
      }
      .brand b {
        color: #0977e4;
      }
      .brand i {
        color: #fe678d;
        font-style: normal;
      }
      .brand small {
        font-size: 20px;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .stars,
      .profile {
        background: #fff;
        box-shadow: 0 4px 17px #b6d8ee7b;
        border-radius: 20px;
        padding: 10px 15px;
        font-weight: 900;
        white-space: nowrap;
      }
      .profile {
        border: 0;
        background: #fff;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 275px;
        gap: 22px;
      }
      .panel {
        background: #fff;
        border-radius: 26px;
        box-shadow: var(--shadow);
        padding: 24px;
      }
      .hero {
        background: linear-gradient(115deg, #51c6fb, #2d9df3 68%, #1379de);
        padding: 30px 34px;
        min-height: 240px;
        position: relative;
        overflow: hidden;
        color: white;
      }
      .hero:before {
        content: '☁';
        color: #ffffff60;
        position: absolute;
        font-size: 160px;
        right: 8px;
        top: -45px;
      }
      .hero:after {
        content: '✦';
        color: #ffef99;
        position: absolute;
        font-size: 80px;
        right: 250px;
        top: 12px;
      }
      .hero-copy {
        position: relative;
        z-index: 1;
        max-width: 70%;
      }
      .eyebrow {
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        opacity: 0.88;
      }
      .hero h1 {
        font-size: clamp(29px, 5vw, 46px);
        line-height: 1.08;
        margin: 9px 0 13px;
      }
      .hero p {
        font-size: 16px;
        max-width: 480px;
        line-height: 1.5;
      }
      .mascot {
        position: absolute;
        font-size: 130px;
        right: 55px;
        bottom: -5px;
        transform: rotate(-8deg);
        filter: drop-shadow(4px 13px 7px #0757b366);
      }
      .btn {
        background: var(--blue);
        border: 0;
        border-radius: 16px;
        color: white;
        font-size: 16px;
        font-weight: 900;
        padding: 14px 19px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        transition:
          transform 0.12s,
          filter 0.12s;
        min-height: 48px;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-green {
        background: #2ebd65;
      }
      .btn-pink {
        background: #fa548d;
      }
      .btn-light {
        background: #fff;        color: var(--navy);
      }
      .btn-outline {
        background: white;
        color: var(--navy);
        border: 2px solid #dbeafb;
      }
      .btn-small {
        font-size: 13px;
        padding: 9px 13px;
        min-height: 40px;
      }
      .btn-full {
        width: 100%;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 22px 0 13px;
      }
      .section-head h2,
      .section-head h3 {
        margin: 0;
        font-size: 23px;
      }
      .muted {
        color: var(--muted);
      }
      .tiny {
        font-size: 12px;
      }
      .levels {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 13px;
      }
      .level {
        background: #fff;
        border: 2px solid transparent;
        border-radius: 23px;
        padding: 17px;
        box-shadow: var(--shadow);
        text-align: left;
        min-height: 176px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        color: var(--navy);
        transition:
          transform 0.13s,
          border-color 0.13s;
      }
      .level:active {
        transform: scale(0.98);
      }
      .level.current {
        border-color: #2cc58b;
      }
      .level.locked {
        opacity: 0.64;
      }
      .level-bubble {
        width: 53px;
        height: 53px;
        border-radius: 17px;
        display: grid;
        place-items: center;
        font-size: 26px;
        background: var(--level-color, #e9f4ff);
      }
      .level strong {
        font-size: 15px;
      }
      .level small {
        color: var(--muted);
        line-height: 1.3;
      }
      .aside h3 {
        margin: 4px 0 13px;
        font-size: 20px;
      }
      .aside .panel {
        margin-bottom: 15px;
      }
      .progressbar {
        height: 11px;
        background: #e8eff7;
        border-radius: 999px;
        overflow: hidden;
      }
      .progressbar span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #36bf79, #70d9ac);
        border-radius: 999px;
      }
      .aside-stat {
        display: flex;
        justify-content: space-between;
        margin-bottom: 9px;
        gap: 10px;
        font-size: 14px;
      }
      .awardline {
        display: flex;
        align-items: center;
        gap: 13px;
        margin: 14px 0;
      }
      .awardicon {
        height: 45px;
        width: 45px;
        border-radius: 15px;
        background: #fff3c7;
        display: grid;
        place-items: center;
        font-size: 25px;
      }
      .bottomnav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9;
        width: min(100%, 1180px);
        padding: 11px max(14px, env(safe-area-inset-right))
          calc(11px + env(safe-area-inset-bottom));
        display: flex;
        justify-content: center;
        gap: 5px;
        border-radius: 25px 25px 0 0;
        background: #fffffff5;
        box-shadow: 0 -8px 35px #3483ad23;
        backdrop-filter: blur(8px);
      }
      .navbtn {
        width: 100%;
        max-width: 160px;
        border: 0;
        background: transparent;
        border-radius: 14px;
        padding: 7px 4px;
        font-weight: 800;
        color: #7390ad;
        display: flex;
        gap: 3px;
        flex-direction: column;
        align-items: center;
        font-size: 11px;
      }
      .navbtn b {
        font-size: 22px;
      }
      .navbtn.active {
        color: #1684e5;
        background: #e8f7ff;
      }
      .backbar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 18px;
      }
      .backbar h1 {
        font-size: 24px;
        margin: 0;
      }
      .quiz-shell {
        max-width: 780px;
        margin: 0 auto;
      }
      .lesson-card {
        background: white;
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 24px;
        min-height: 370px;
      }
      .lesson-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .lesson-card h2 {
        text-align: center;
        font-size: clamp(22px, 4vw, 31px);
        margin: 13px auto 16px;
        max-width: 630px;
        line-height: 1.25;
      }
      .prompt {
        text-align: center;
        color: var(--muted);
        font-weight: 700;
        font-size: 14px;
      }
      .big-glyph {
        width: 155px;
        height: 145px;
        margin: 14px auto;
        background: linear-gradient(135deg, #ffdeec, #ebf1ff);
        border-radius: 30px;
        display: grid;
        place-items: center;
        font-size: 90px;
        font-weight: 1000;
      }
      .blending {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 22px auto;
      }
      .tile {
        min-width: 90px;
        height: 90px;
        padding: 9px 14px;
        border-radius: 21px;
        display: grid;
        place-items: center;
        font-weight: 1000;
        font-size: 39px;
        color: #2d4880;
        background: #ffdee9;
      }
      .tile:nth-of-type(2) {
        background: #daf4ff;
      }
      .reading-text {
        background: #fff7e2;
        padding: 20px;
        border-radius: 20px;
        line-height: 1.8;
        font-size: 21px;
        max-width: 590px;
        margin: 15px auto;
        text-align: center;
      }
      .story {
        max-width: 580px;
        background: #fff7e7;
        border-radius: 22px;
        padding: 20px 26px;
        margin: 16px auto;
        font-size: 20px;
        line-height: 1.7;
      }
      .illustration {
        height: 168px;
        width: 168px;
        object-fit: cover;
        border-radius: 24px;
        display: block;
        margin: 12px auto;
        box-shadow: 0 10px 23px #91aac633;
      }
      .speak-wrap {
        text-align: center;
        margin: 14px auto;
      }
      .answer-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin: 20px 0 10px;
      }
      .answer {
        min-height: 82px;
        border: 3px solid #dfeaf7;
        background: #f8fcff;
        border-radius: 20px;
        font-size: 24px;
        font-weight: 1000;
        color: var(--navy);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        flex-direction: column;
        padding: 8px;
      }
      .answer img {
        width: 100%;
        max-width: 115px;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 15px;
      }
      .answer.image-answer {
        min-height: 162px;
        font-size: 15px;
      }
      .answer.selected {
        border-color: #1a91ef;
        background: #e8f5ff;
      }
      .answer.correct {
        background: #d9f8e9;
        border-color: #39bc7a;
      }
      .answer.wrong {
        background: #ffe7e6;
        border-color: #fc7474;
      }
      .feedback {
        border-radius: 15px;
        padding: 15px;
        font-weight: 900;
        text-align: center;
        margin: 14px 0;
      }
      .feedback.good {
        background: #dff9ea;
        color: #196543;
      }
      .feedback.bad {
        background: #fff1d9;
        color: #9b5d14;
      }
      .quiz-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 13px;
        margin-top: 15px;
      }
      .quiz-footer .btn {
        min-width: 150px;
      }
      .gamecards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .gamecard {
        background: #fff;
        box-shadow: var(--shadow);
        border: 0;
        border-radius: 24px;
        padding: 23px;
        text-align: left;
        color: var(--navy);
        display: flex;
        gap: 10px;
        flex-direction: column;
      }
      .gamecard .emoji {
        font-size: 46px;
      }
      .gamecard strong {
        font-size: 19px;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .kpi {
        padding: 18px;
        background: #fff;
        border-radius: 19px;
        box-shadow: var(--shadow);
      }
      .kpi b {
        font-size: 30px;
        display: block;
      }
      .kpi span {
        color: var(--muted);
        font-size: 13px;
      }
      .summary {
        background: #fff;
        border-radius: 25px;
        padding: 20px;
        margin: 18px 0;
        box-shadow: var(--shadow);
      }
      .summaryline {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 13px 0;
      }
      .summaryline strong {
        width: 168px;
        font-size: 13px;
      }
      .summaryline .progressbar {
        flex: 1;
      }
      .summaryline em {
        font-size: 12px;
        color: #5c7593;
        font-style: normal;
      }
      .notice {
        background: #fff9e7;
        border: 1px solid #ffe2a3;
        border-radius: 15px;
        padding: 13px 16px;
        color: #806115;
        line-height: 1.5;
        font-size: 13px;
      }
      .assessment-result {
        text-align: center;
        background: #fff;
        padding: 30px;
        border-radius: 24px;
      }
      .callout {
        background: #e3f8ff;
        border-radius: 20px;
        padding: 20px;
        line-height: 1.5;
      }
      .tag {
        display: inline-block;
        font-size: 12px;
        font-weight: 900;
        color: #257fbb;
        background: #e5f6ff;
        padding: 5px 10px;
        border-radius: 100px;
      }
      #toast {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #183d72;
        color: white;
        padding: 12px 18px;
        border-radius: 15px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 20;
        max-width: 320px;
      }
      #toast.show {
        opacity: 1;
      }
      @media (max-width: 940px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .aside {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 15px;
        }
        .aside .panel {
          margin: 0;
        }
        .levels {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 640px) {
        .app-shell {
          padding: 14px 14px 99px;
        }
        .brand {
          font-size: 27px;
        }
        .stars {
          padding: 9px 10px;
        }
        .profile {
          padding: 10px;
        }
        .hero {
          padding: 25px;
          min-height: 260px;
        }
        .hero-copy {
          max-width: 100%;
        }
        .hero h1 {
          max-width: 78%;
          font-size: 32px;
        }
        .hero p {
          max-width: 68%;
          font-size: 14px;
        }
        .hero .btn {
          max-width: 68%;
          font-size: 14px;
        }
        .mascot {
          font-size: 90px;
          right: 0;
          bottom: 20px;
        }
        .levels {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 11px;
        }
        .level {
          padding: 13px;
          min-height: 159px;
        }
        .level strong {
          font-size: 14px;
        }
        .aside {
          grid-template-columns: 1fr;
        }
        .panel {
          padding: 18px;
        }
        .lesson-card {
          padding: 16px;
          border-radius: 21px;
        }
        .answer {
          font-size: 21px;
          min-height: 75px;
        }
        .answer.image-answer {
          min-height: 155px;
        }
        .quiz-footer .btn {
          min-width: 0;
        }
        .dashboard-grid {
          grid-template-columns: 1fr 1fr;
        }
        .gamecards {
          gap: 11px;
        }
        .gamecard {
          padding: 16px;
        }
        .section-head h2 {
          font-size: 20px;
        }
        .backbar h1 {
          font-size: 21px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }

      /* Pilot v0.2: dedicated tactile practice and readable accessibility focus */
      .studio-callout {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      .studio-callout p {
        margin: 8px 0 0;
        font-size: 14px;
      }
      .studio-panel h2 {
        font-size: 23px;
        margin-top: 23px;
      }
      .studio-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 11px;
      }
      .sound-tile {
        background: #ecf6ff;
        border: 2px solid #d3eafa;
        border-radius: 19px;
        color: #18599c;
        font-weight: 900;
        font-size: 32px;
        min-height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 4px;
      }
      .sound-tile span {
        font-size: 18px;
      }
      .word-studio {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 13px;
      }
      .word-card {
        border: 2px solid #e5edf6;
        background: #fff;
        border-radius: 18px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-size: 19px;
        color: #124b88;
      }
      .word-card img {
        width: 120px;
        max-width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 14px;
      }
      .word-card span {
        color: #397ab0;
        font-size: 13px;
      }
      .review-cta {
        margin-top: 9px;
      }
      .alias-input {
        display: block;
        width: 100%;
        margin: 9px 0;
        padding: 12px;
        border: 2px solid #cce3f5;
        border-radius: 14px;
        font-size: 16px;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 4px solid #ffb43e;
        outline-offset: 3px;
      }
      @media (max-width: 640px) {
        .studio-callout {
          flex-direction: column;
          align-items: stretch;
        }
        .studio-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .word-studio {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .sound-tile {
          min-height: 88px;
          font-size: 30px;
        }
      }
      .release-strip { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:20px; font-size:14px; font-weight:700; }
      .app-footer { text-align:center; color:#506b87; font-size:13px; line-height:1.8; margin:30px 0 10px; }
      .text-button { border:0; color:#245c8a; background:transparent; text-decoration:underline; padding:10px; min-height:44px; }
      .guide { max-width:820px; margin:auto; line-height:1.75; }
      .guide h2 { margin-top:28px; font-size:22px; }
      .guide li { margin:10px 0; }
      .topbar, .summaryline { flex-wrap:wrap; }
      .summaryline .progressbar { min-width:80px; }
      .navbtn { min-height:48px; color:#496480; }
      .muted { color:#506b87; }
      @media print {
        .bottomnav, .topbar, button, input, .app-footer { display:none !important; }
        body { background:white; color:black; }
        .app-shell { padding:0; }
        .panel, .summary, .kpi { box-shadow:none; border:1px solid #ccc; break-inside:avoid; }
      }
    </style>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script>
      'use strict';
      // FONIKids demonstration: No server calls, tracking pixels, or third-party scripts.
      // SpeechSynthesis is a whole-word demo only; do NOT use it as validated phoneme audio.
      const LEVELS = [
        {
          id: 1,
          name: 'Petualangan Bunyi',
          desc: 'Dengar dan bedakan bunyi',
          emoji: '👂',
          color: '#fff1b7',
        },
        {
          id: 2,
          name: 'Sahabat Huruf',
          desc: 'Kenal huruf dan bunyinya',
          emoji: '🔤',
          color: '#e6dafa',
        },
        {
          id: 3,
          name: 'Pabrik Suku Kata',
          desc: 'Rangkai bunyi menjadi suku kata',
          emoji: '🧩',
          color: '#d9f6f0',
        },
        {
          id: 4,
          name: 'Detektif Kata',
          desc: 'Baca kata dan cocokkan gambar',
          emoji: '🔎',
          color: '#dcecff',
        },
        {
          id: 5,
          name: 'Penjelajah Kalimat',

        );
      }
      function renderGuide() { shell("<div class=\"backbar\"><button class=\"btn btn-small btn-outline\" data-action=\"home\">← Beranda</button><h1>Panduan pendamping</h1></div><article class=\"panel guide\"><span class=\"tag\">FONIKids • Pratinjau 0.3</span><h2>Belajar bertahap, dengan gembira</h2><p>Latihan membaca Bahasa Indonesia untuk anak sekitar usia 4–8 tahun bersama orang tua atau guru. Seluruh level terbuka; pilih sesuai kesiapan anak.</p><ol><li>Pilih level atau coba eksplorasi awal enam pertanyaan.</li><li>Satu sesi berisi lima soal acak dari 15 soal per level. Dampingi anak membaca instruksi.</li><li>Beri kesempatan menjawab. Jawaban benar ditandai setelah diperiksa; hasil dan bintang dicatat.</li><li>Lihat catatan di Area Pendamping. Soal yang dijawab benar saat latihan ulang dikeluarkan dari daftar ulang.</li><li>Ekspor JSON untuk cadangan. Pulihkan hanya cadangan FONIKids milik Anda.</li></ol><h2>Suara dan materi</h2><p>Audio memakai pembaca suara perangkat, bukan rekaman fonem tervalidasi. Contohkan bunyi langsung: nama huruf dan bunyi huruf berbeda. Jika suara Indonesia tidak tersedia, latihan visual tetap dapat digunakan. Tidak ada perekaman mikrofon.</p><p>Skor pilihan ganda adalah catatan latihan, bukan diagnosis, tes standar, atau jaminan anak lancar membaca. Materi dan audio perlu ditinjau pendidik sebelum rilis komersial final.</p><h2>Privasi & penyimpanan</h2><p>Aplikasi tidak meminta nama lengkap, foto, tanggal lahir, atau akun anak. Nama panggilan dan progres disimpan di browser ini tanpa sinkronisasi lintas perangkat. Hosting menerima permintaan halaman seperti situs biasa. Pembaca suara dapat memakai layanan browser atau sistem operasi.</p><p>Gerbang hitung hanya mencegah ketukan tidak sengaja. Siapa pun yang memakai browser yang sama dapat mengakses data lokal. Cadangan berisi nama panggilan dan hasil latihan: simpan sendiri dan jangan unggah ke tempat publik.</p><h2>Informasi produk</h2><p>90 soal, enam level, empat pintasan permainan, Studio Bunyi, latihan ulang, catatan lokal, cadangan JSON, dan laporan cetak. Internet diperlukan untuk membuka halaman; belum tersedia instalasi offline atau akun pelanggan.</p><p>Pratinjau ini tidak memproses pembayaran dan tidak membatasi akses berdasarkan pembelian. Harga, lisensi penggunaan, dukungan, dan pengiriman produk perlu ditetapkan pengelola Genius Health Digital sebelum penjualan dibuka. Tidak ada klaim pendaftaran merek atau hak cipta.</p></article>"); }
      function render() {
        if (view === 'home') return renderHome();
        if (view === 'levels') return renderLevels();
        if (view === 'games') return renderGames();
        if (view === 'studio') return renderStudio();
        if (view === 'awards') return renderAwards();
        if (view === 'quiz') return renderQuiz();
        if (view === 'result') return renderResult();
        if (view === 'gate') return renderGate();
        if (view === 'parent') return renderParent();
        if (view === 'guide') return renderGuide();
        renderHome();
      }
      function speak(text) {
        if (!('speechSynthesis' in window))
          return notify('Perangkat ini belum mendukung suara demo.');
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'id-ID';
        u.rate = 0.78;
        u.pitch = 1;
        const available = speechSynthesis
          .getVoices()
          .filter(v => v.lang.toLowerCase().startsWith('id'));
        if (available.length) u.voice = available[0];
        u.onerror = () => notify('Suara belum tersedia. Pendamping dapat membacakan teks, lalu coba lagi.');
        speechSynthesis.speak(u);
        if (!available.length)
          notify(
            'Suara Bahasa Indonesia bergantung pada perangkat. Gunakan rekaman fonem tervalidasi pada versi rilis.'
          );
      }
      function exportData() {
        const blob = new Blob([JSON.stringify(state, null, 2)], {
            type: 'application/json',
          }),
          u = URL.createObjectURL(blob),
          a = document.createElement('a');
        a.href = u;
        a.download = 'FONIKids_progres_lokal.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(u), 500);
      }
      document.addEventListener('change', async event => {
        if(event.target.id !== 'backup-file' || view !== 'parent') return;
        const file=event.target.files?.[0];
        if(!file) return;
        try {
          if(file.size > 1000000) throw new Error('Cadangan terlalu besar (maksimal 1 MB).');
          const raw=JSON.parse(await file.text());
          const restored=cleanState(raw);
          if(restored.results.length !== raw.results.length) throw new Error('Cadangan berisi hasil latihan tidak valid.');
          if(!confirm('Ganti progres browser ini dengan cadangan? Ekspor data saat ini dahulu bila diperlukan.')) return;
          state=restored;
          persist();
          renderParent();
          notify('Cadangan berhasil dipulihkan.');
        } catch(error) {
          notify(error instanceof SyntaxError ? 'Berkas bukan JSON yang valid.' : error.message);
        }
        event.target.value='';
      });
      document.addEventListener('click', ev => {
        const el = ev.target.closest('[data-action]');
        if (!el) return;
        const action = el.dataset.action;
        const id = Number(el.dataset.level);
        if (action === 'home') {
          view = 'home';
          session = null;
          render();
        } else if (
          action === 'levels' ||
          action === 'games' ||
          action === 'awards'
        ) {
          view = action;
          render();
        } else if (action === 'start') startSession(id);
        else if (action === 'assessment') startSession(1, true);
        else if (action === 'studio') {
          view = 'studio';
          render();
        } else if (action === 'review') startReview();
        else if (action === 'choose') {
          if (feedback !== null) return;
          answer = Number(el.dataset.choice);
          renderQuiz();
        } else if (action === 'check') check();
        else if (action === 'next') next();
        else if (action === 'speak')
          speak(decodeURIComponent(el.dataset.text || ''));
        else if (action === 'parent') {
          gateA = null;
          view = 'gate';
          render();
        } else if (action === 'gate') {
          if (document.getElementById('gate').value.trim() !== '' && Number(document.getElementById('gate').value) === gateA?.answer) {
            view = 'parent';
            render();
          } else notify('Jawaban belum benar. Coba lagi.');
        } else if (action === 'rename' && view === 'parent') {
          const el = document.getElementById('alias');
          const alias = el?.value.trim();
          if (!alias || alias.length > 24)
            return notify('Nama panggilan perlu 1–24 karakter.');
          state.alias = alias;
          persist();
          render();
          notify('Nama panggilan tersimpan pada perangkat ini.');
        } else if (action === 'export' && view === 'parent') exportData();
        else if (action === 'import' && view === 'parent') document.getElementById('backup-file').click();
        else if (action === 'print' && view === 'parent') window.print();
        else if (action === 'guide') {view='guide';render();}
        else if (action === 'reset' && view === 'parent') {
          if (confirm('Hapus semua progres belajar dari browser ini?')) {
            state = initial();
            persist();
            view = 'home';
            render();
            notify('Progres lokal sudah dikosongkan.');
          }
        }
      });
      // Single-file offline preview: service worker omitted intentionally.
      render();
    </script>
  </body>
